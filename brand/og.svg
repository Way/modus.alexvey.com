<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Full-canvas grid -->
    <pattern id="bg-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0L0 0 0 30" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="0.5"/>
    </pattern>
    <!-- Karte grid (slightly stronger) -->
    <pattern id="karte-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0L0 0 0 30" fill="none" stroke="rgba(255,255,255,0.055)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- ═══ BACKGROUND ═══ -->
  <rect width="1200" height="630" fill="#0E1014"/>
  <rect width="1200" height="630" fill="url(#bg-grid)"/>

  <!-- Outer frame -->
  <rect x="18" y="18" width="1164" height="594" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>

  <!-- Corner marks (technical drawing L-shapes) -->
  <g fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="1">
    <path d="M18 62 L18 18 L62 18"/>
    <path d="M1182 62 L1182 18 L1138 18"/>
    <path d="M18 568 L18 612 L62 612"/>
    <path d="M1182 568 L1182 612 L1138 612"/>
  </g>

  <!-- ═══ TOP SCALE BAR ═══ -->
  <g transform="translate(80,34)" stroke="rgba(255,255,255,0.18)" stroke-width="0.5" fill="none">
    <line x1="0" y1="0" x2="460" y2="0"/>
    <line x1="0" y1="-3" x2="0" y2="3"/>
    <line x1="115" y1="-2" x2="115" y2="2"/>
    <line x1="230" y1="-3" x2="230" y2="3"/>
    <line x1="345" y1="-2" x2="345" y2="2"/>
    <line x1="460" y1="-3" x2="460" y2="3"/>
    <text x="230" y="-8" text-anchor="middle" fill="#6E6B63" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" stroke="none">· 30 Tage ·</text>
  </g>

  <!-- ═══ BOTTOM COORDS ═══ -->
  <text x="80" y="621" fill="#6E6B63" font-family="'JetBrains Mono','Courier New',monospace" font-size="9">N 51° 19'</text>
  <text x="560" y="621" text-anchor="end" fill="#6E6B63" font-family="'JetBrains Mono','Courier New',monospace" font-size="9">E 9° 29'</text>

  <!-- ═══════════════════════════════════════════
       LEFT TEXT AREA
  ═══════════════════════════════════════════ -->

  <!-- Nav mark glyph: MV-Mark (Ring + Chevrons + Mittelbalken) -->
  <svg x="80" y="54" width="22" height="22" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="11" fill="none" stroke="rgba(244,239,229,0.7)" stroke-width="0.7"/>
    <circle cx="12" cy="12" r="11.5" fill="none" stroke="rgba(244,239,229,0.3)" stroke-width="0.42"/>
    <path d="M8.548 11.6 L12.38 2.978 L16.212 11.6 L14.188 11.6 L11.62 5.822 L9.052 11.6 Z" fill="rgba(244,239,229,0.85)"/>
    <path d="M7.788 12.4 L11.62 21.022 L15.452 12.4 L14.948 12.4 L12.38 18.178 L9.812 12.4 Z" fill="#2A7A6F"/>
    <path d="M10.144 8.326 L13.856 8.326 L13.856 8.826 L10.144 8.826 Z" fill="rgba(244,239,229,0.85)"/>
  </svg>
  <!-- Wordmark -->
  <text x="110" y="69" fill="rgba(244,239,229,0.8)" font-family="'Geist',-apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="500">Modus</text>
  <circle cx="153" cy="63.5" r="1.8" fill="#1E4F4A"/>
  <text x="160" y="69" fill="rgba(244,239,229,0.8)" font-family="'Geist',-apple-system,'Helvetica Neue',sans-serif" font-size="14" font-weight="500">Vey</text>

  <!-- Eyebrow -->
  <text x="80" y="122" fill="#7C8B7E" font-family="'JetBrains Mono','Courier New',monospace" font-size="11" letter-spacing="2.5">MODUS OPERANDI · I</text>
  <!-- Eyebrow tick line -->
  <line x1="80" y1="130" x2="300" y2="130" stroke="rgba(124,139,126,0.3)" stroke-width="0.5"/>

  <!-- Headline line 1: Methode -->
  <text x="76" y="248" fill="#F4EFE5" font-family="'Geist',-apple-system,'Helvetica Neue',sans-serif" font-size="106" font-weight="700" letter-spacing="-2.5">Methode</text>

  <!-- Headline line 2: statt Magie. (serif italic) -->
  <text x="76" y="346" fill="#F4EFE5" font-family="'Instrument Serif',Georgia,'Times New Roman',serif" font-size="86" font-style="italic">statt Magie.</text>

  <!-- Teal rule under headline block -->
  <line x1="80" y1="370" x2="80" y2="370" stroke="#1E4F4A" stroke-width="0"/> <!-- spacer -->
  <line x1="80" y1="372" x2="460" y2="372" stroke="#1E4F4A" stroke-width="1.5"/>
  <circle cx="80" cy="372" r="2.5" fill="#1E4F4A"/>
  <circle cx="460" cy="372" r="1.5" fill="rgba(30,79,74,0.5)"/>

  <!-- Lead text -->
  <text x="80" y="410" fill="#C5BFB1" font-family="'Geist',-apple-system,'Helvetica Neue',sans-serif" font-size="16.5" font-weight="300" letter-spacing="0.2">KI-Beratung für den deutschen Mittelstand</text>

  <!-- Tag chips -->
  <g font-family="'JetBrains Mono','Courier New',monospace" font-size="10.5">
    <!-- 30 Tage -->
    <rect x="80" y="436" width="70" height="20" rx="2" fill="rgba(30,79,74,0.18)" stroke="rgba(42,122,111,0.5)" stroke-width="0.8"/>
    <text x="115" y="450" text-anchor="middle" fill="#2A7A6F">30 Tage</text>
    <!-- Festpreis -->
    <rect x="158" y="436" width="70" height="20" rx="2" fill="rgba(30,79,74,0.18)" stroke="rgba(42,122,111,0.5)" stroke-width="0.8"/>
    <text x="193" y="450" text-anchor="middle" fill="#2A7A6F">Festpreis</text>
    <!-- Sprint anrechenbar (hook) -->
    <rect x="236" y="436" width="124" height="20" rx="2" fill="rgba(30,79,74,0.18)" stroke="rgba(42,122,111,0.5)" stroke-width="0.8"/>
    <text x="298" y="450" text-anchor="middle" fill="#2A7A6F">Sprint anrechenbar</text>
    <!-- DSGVO -->
    <rect x="368" y="436" width="72" height="20" rx="2" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="0.8"/>
    <text x="404" y="450" text-anchor="middle" fill="#7E7A70">EU · DSGVO</text>
  </g>

  <!-- Domain -->
  <text x="80" y="594" fill="#7E7A70" font-family="'JetBrains Mono','Courier New',monospace" font-size="12" letter-spacing="0.3">modus.alexvey.com</text>

  <!-- Vertical divider -->
  <line x1="624" y1="45" x2="624" y2="585" stroke="rgba(255,255,255,0.05)" stroke-width="0.5" stroke-dasharray="2 5"/>

  <!-- ═══════════════════════════════════════════
       RIGHT: MODUS-KARTE
       Karte center: (895, 315), node offset ±125
       I:(770,190) II:(1020,190) III:(1020,440) IV:(770,440)
  ═══════════════════════════════════════════ -->

  <!-- Karte background grid -->
  <rect x="640" y="40" width="524" height="550" fill="url(#karte-grid)"/>

  <!-- Karte corner marks -->
  <g fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="0.8">
    <path d="M640 72 L640 45 L667 45"/>
    <path d="M1164 72 L1164 45 L1137 45"/>
    <path d="M640 558 L640 585 L667 585"/>
    <path d="M1164 558 L1164 585 L1137 585"/>
  </g>

  <!-- Karte scale bar -->
  <g transform="translate(660,58)" stroke="rgba(255,255,255,0.13)" stroke-width="0.5" fill="none">
    <line x1="0" y1="0" x2="480" y2="0"/>
    <line x1="0" y1="-2.5" x2="0" y2="2.5"/>
    <line x1="120" y1="-1.5" x2="120" y2="1.5"/>
    <line x1="240" y1="-2.5" x2="240" y2="2.5"/>
    <line x1="360" y1="-1.5" x2="360" y2="1.5"/>
    <line x1="480" y1="-2.5" x2="480" y2="2.5"/>
  </g>

  <!-- Karte annotation box (top-left) -->
  <g transform="translate(666,73)">
    <rect x="-2" y="-10" width="82" height="36" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
    <text x="0" y="0" fill="#6E6B63" font-family="'JetBrains Mono','Courier New',monospace" font-size="7.5" letter-spacing="1">METHODE</text>
    <text x="0" y="12" fill="#7E7A70" font-family="'JetBrains Mono','Courier New',monospace" font-size="8">M-2026.05</text>
    <text x="0" y="22" fill="#7E7A70" font-family="'JetBrains Mono','Courier New',monospace" font-size="8">REV. IV</text>
  </g>

  <!-- Karte compass (top-right) -->
  <g transform="translate(1125,88)">
    <circle cx="0" cy="0" r="17" fill="none" stroke="rgba(255,255,255,0.09)" stroke-width="0.8"/>
    <line x1="0" y1="-17" x2="0" y2="-11" stroke="rgba(255,255,255,0.14)" stroke-width="0.7"/>
    <line x1="0" y1="17" x2="0" y2="11" stroke="rgba(255,255,255,0.14)" stroke-width="0.7"/>
    <line x1="-17" y1="0" x2="-11" y2="0" stroke="rgba(255,255,255,0.14)" stroke-width="0.7"/>
    <line x1="17" y1="0" x2="11" y2="0" stroke="rgba(255,255,255,0.14)" stroke-width="0.7"/>
    <polygon points="0,-11 -2.5,2.5 0,0 2.5,2.5" fill="#1E4F4A"/>
    <polygon points="0,11 -2,2 0,0 2,2" fill="#6E6B63"/>
    <text x="0" y="-20" text-anchor="middle" fill="#6E6B63" font-family="'JetBrains Mono','Courier New',monospace" font-size="7">N</text>
  </g>

  <!-- Karte coord labels (bottom) -->
  <text x="660" y="598" fill="#6E6B63" font-family="'JetBrains Mono','Courier New',monospace" font-size="9">N 51° 19'</text>
  <text x="1148" y="598" text-anchor="end" fill="#6E6B63" font-family="'JetBrains Mono','Courier New',monospace" font-size="9">E 9° 29'</text>

  <!-- Crosshair through karte center (895,315) -->
  <line x1="895" y1="40" x2="895" y2="590" stroke="rgba(255,255,255,0.04)" stroke-width="0.5" stroke-dasharray="2 5"/>
  <line x1="640" y1="315" x2="1164" y2="315" stroke="rgba(255,255,255,0.04)" stroke-width="0.5" stroke-dasharray="2 5"/>

  <!-- Path shadows (dashed bg) -->
  <g fill="none" stroke="rgba(255,255,255,0.07)" stroke-dasharray="3 4" stroke-width="1">
    <path d="M770,190 Q895,150 1020,190"/>
    <path d="M1020,190 Q1060,315 1020,440"/>
    <path d="M1020,440 Q895,480 770,440"/>
    <path d="M770,440 Q730,315 770,190"/>
    <path d="M770,190 L1020,440"/>
    <path d="M1020,190 L770,440"/>
  </g>

  <!-- Main teal paths -->
  <g fill="none" stroke="#1E4F4A" stroke-width="1.5">
    <path d="M770,190 Q895,150 1020,190"/>
    <path d="M1020,190 Q1060,315 1020,440"/>
    <path d="M1020,440 Q895,480 770,440"/>
    <path d="M770,440 Q730,315 770,190"/>
  </g>

  <!-- Path tick marks -->
  <g stroke="rgba(255,255,255,0.18)" stroke-width="0.6" fill="none">
    <line x1="845" y1="157" x2="845" y2="163"/>
    <line x1="895" y1="152" x2="895" y2="158"/>
    <line x1="945" y1="157" x2="945" y2="163"/>
    <line x1="1050" y1="252" x2="1056" y2="252"/>
    <line x1="1056" y1="315" x2="1062" y2="315"/>
    <line x1="1050" y1="378" x2="1056" y2="378"/>
    <line x1="845" y1="457" x2="845" y2="463"/>
    <line x1="895" y1="462" x2="895" y2="468"/>
    <line x1="945" y1="457" x2="945" y2="463"/>
    <line x1="734" y1="252" x2="740" y2="252"/>
    <line x1="728" y1="315" x2="734" y2="315"/>
    <line x1="734" y1="378" x2="740" y2="378"/>
  </g>

  <!-- Node glows -->
  <circle cx="770" cy="190" r="13" fill="rgba(30,79,74,0.22)"/>
  <circle cx="1020" cy="190" r="13" fill="rgba(30,79,74,0.22)"/>
  <circle cx="1020" cy="440" r="13" fill="rgba(30,79,74,0.22)"/>
  <circle cx="770" cy="440" r="13" fill="rgba(30,79,74,0.22)"/>

  <!-- Nodes -->
  <circle cx="770" cy="190" r="5.5" fill="#2A7A6F" stroke="rgba(244,239,229,0.25)" stroke-width="0.7"/>
  <circle cx="1020" cy="190" r="5.5" fill="#2A7A6F" stroke="rgba(244,239,229,0.25)" stroke-width="0.7"/>
  <circle cx="1020" cy="440" r="5.5" fill="#2A7A6F" stroke="rgba(244,239,229,0.25)" stroke-width="0.7"/>
  <circle cx="770" cy="440" r="5.5" fill="#2A7A6F" stroke="rgba(244,239,229,0.25)" stroke-width="0.7"/>

  <!-- Roman numerals -->
  <text x="754" y="180" text-anchor="end" fill="#7E7A70" font-family="'JetBrains Mono','Courier New',monospace" font-size="10">I</text>
  <text x="1036" y="180" fill="#7E7A70" font-family="'JetBrains Mono','Courier New',monospace" font-size="10">II</text>
  <text x="1036" y="460" fill="#7E7A70" font-family="'JetBrains Mono','Courier New',monospace" font-size="10">III</text>
  <text x="754" y="460" text-anchor="end" fill="#7E7A70" font-family="'JetBrains Mono','Courier New',monospace" font-size="10">IV</text>

  <!-- Node labels -->
  <text x="754" y="167" text-anchor="end" fill="#7C8B7E" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" letter-spacing="1">ZUHÖREN</text>
  <text x="1036" y="167" fill="#7C8B7E" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" letter-spacing="1">VERSTEHEN</text>
  <text x="1036" y="476" fill="#7C8B7E" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" letter-spacing="1">LÖSEN</text>
  <text x="754" y="476" text-anchor="end" fill="#7C8B7E" font-family="'JetBrains Mono','Courier New',monospace" font-size="9" letter-spacing="1">LIEFERN</text>

  <!-- Center MODUS circle with AV-Mark -->
  <circle cx="895" cy="315" r="30" fill="#0E1014" stroke="rgba(244,239,229,0.18)" stroke-width="1"/>
  <circle cx="895" cy="315" r="19" fill="none" stroke="rgba(244,239,229,0.09)" stroke-width="0.5" stroke-dasharray="2 2"/>
  <!-- MV-Mark: Chevrons + Mittelbalken (V in Teal, wie die Pfade) -->
  <svg x="880" y="300" width="30" height="30" viewBox="0 0 24 24">
    <path d="M8.548 11.6 L12.38 2.978 L16.212 11.6 L14.188 11.6 L11.62 5.822 L9.052 11.6 Z" fill="#F4EFE5"/>
    <path d="M7.788 12.4 L11.62 21.022 L15.452 12.4 L14.948 12.4 L12.38 18.178 L9.812 12.4 Z" fill="#2A7A6F"/>
    <path d="M10.144 8.326 L13.856 8.326 L13.856 8.826 L10.144 8.826 Z" fill="#F4EFE5"/>
  </svg>
  <text x="895" y="340" text-anchor="middle" fill="#7E7A70" font-family="'JetBrains Mono','Courier New',monospace" font-size="7.5">MODUS</text>

</svg>
